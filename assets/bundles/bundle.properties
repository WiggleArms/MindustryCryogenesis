planet.cryogenesis-innelis.name = Innelis

sector.cryogenesis-zero.name = Zero
sector.cryogenesis-zero.description = Placeholder map for development tests.

sector.cryogenesis-cryogenesis.name = Cryogenesis
sector.cryogenesis-cryogenesis.description = A small pocket of warmth in the frigid expanse. Limited resources.\n\nDevelop the technology and infrastructure needed to survive. 

sector.cryogenesis-last-stand.name = Last Stand
sector.cryogenesis-last-stand.description = Trajectory analysis predicts that this sector's core will be inaccesable after landing, preventing the accumulation of additional resources.\n\nUse the resources stored in the core to plan your defense and defeat the enemy. Research [TBD] technology.

cryogenesis.mine = Move near the :ore-nickel: [accent]nickel ore[] on the ground and click to begin mining.
cryogenesis.research = Open the :tree: tech tree.\n Research the :scrapper: [accent]Scrapper[], then select it from the :units: menu in the bottom right.\nClick to place it.
cryogenesis.move = :left: Move left for further objectives.
cryogenesis.derelict = The enemy has abandoned some derelict units nearby. Click to fire your weapon and destroy them.
cryogenesis.pickup = Destroying units leaves behind debris. Move over the scrap and press [accent][[[] to pick up the debris. Your core unit can carry up to 4 small debris at once.
cryogenesis.scrap = Move over the [accent]Scrapper[] and press [accent]][] to drop the debris into the [accent]Scrapper[]. The [accent]Scrapper[] will convert the debris into scrap.
cryogenesis.compactor = Research and place a :nickel-compactor:.
cryogenesis.pipes = Research and place :pipe: [accent]Pipes[] to move the scrap from the [accent]Scrapper[] to the [accent]Nickel Compactor[].\n It will output :nickel: nickel to all nearby pipes.
cryogenesis.nickel = Move the output :nickel: from the :nickel-compactor: [accent]Nickel Compactor[] into the core.
cryogenesis.collect = Continue scrapping the derelict units to accumulate 50 :nickel: nickel.
cryogenesis.pelt = Research and place a :pelt: [accent]Pelt[] turret to defend the core.\nPelt turrets require :nickel: [accent]ammo[] from pipes.
cryogenesis.walls = [accent]Walls[] can prevent oncoming damage from reaching buildings.\nResearch and place :nickel-wall: [accent]Nickel Walls[] around the turret and the core.
cryogenesis.dropzone = This is the enemy drop zone.\nAnything in the radius is destroyed when a new waves starts.
croygenesis.wave = A wave will begin now.\nGet ready.
cryogenesis.survive = Use the resources from the debris to expand your defense. Defend against all the waves to [accent]capture the sector[].
cryogenesis.auger = Capturing sectors can grant access to new technologies. Research and place the :mechanical-auger: [accent]Mechanical Auger[] on a nickel ore deposit to begin mining it indefinitely.\nUse these resources to expand to other sectors.

